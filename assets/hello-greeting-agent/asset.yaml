apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: hello-greeting-agent
  version: 1.0.0
  description: An AI agent that greets every user with hello at the start of every conversation.

agentCard:
  name: Hello Greeting Agent
  version: 1.0.0
  description: An AI agent that greets every user with hello at the start of every conversation.

provides:
  apis:
    - name: hello-greeting-agent
      kind: a2a
      ordId: customer.build:apiResource:hello-greeting-550a1.hello-greeting-agent:v1

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
